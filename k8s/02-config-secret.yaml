apiVersion: v1
kind: ConfigMap
metadata:
  name: campuscare-config
  namespace: campuscare
data:
  DB_HOST: postgres-service
  DB_PORT: "5432"
  DB_NAME: campuscare
  DB_SSL: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: campuscare-secret
  namespace: campuscare
type: Opaque
stringData:
  DB_USER: campus
  DB_PASSWORD: change-this-local-password
  STAFF_USER: staff
  STAFF_PASS: change-this-staff-password
  TOKEN_SECRET: replace-with-a-long-random-secret

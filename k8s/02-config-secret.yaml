apiVersion: v1
kind: ConfigMap
metadata:
  name: campuscare-config
  namespace: campuscare
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: campus
  DB_NAME: campuscare
  DB_SSL: "false"
  STAFF_USERNAME: staff
---
apiVersion: v1
kind: Secret
metadata:
  name: campuscare-secret
  namespace: campuscare
type: Opaque
stringData:
  DB_PASSWORD: campus_pass
  STAFF_PASSWORD: Staff@123
  TOKEN_SECRET: local-k8s-secret-change-me

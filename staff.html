<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusCare | Staff</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="brand" href="/"><img src="/images/amal-jyothi-college-logo.png" alt=""><span><b>CampusCare</b><small>Staff workspace</small></span></a><nav><a href="/">Student portal</a></nav></header><main class="section"><p class="eyebrow">STAFF WORKSPACE</p><h1>Complaint management</h1><section id="loginBox" class="form-panel"><h2>Staff sign in</h2><form id="loginForm"><div class="form-grid"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label></div><button class="button primary" type="submit">Sign in</button><p id="loginMessage" role="status"></p></form></section><section id="dashboard" hidden><div id="stats" class="steps"></div><div class="form-panel"><div class="form-grid"><label>Search reference or title<input id="search" placeholder="CH-0001 or projector"></label><label>Status filter<select id="statusFilter"><option value="">All statuses</option><option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option></select></label><label>Category filter<select id="categoryFilter"><option value="">All categories</option><option>Classroom / Equipment</option><option>Network / Wi-Fi</option><option>Library</option><option>Hostel / Facilities</option><option>Transport</option><option>Administration</option><option>Other</option></select></label><div><button id="refresh" class="button primary" type="button">Refresh complaints</button><button id="logout" class="button secondary" type="button">Sign out</button></div></div></div><div id="complaints" class="faq-list"></div></section></main><footer><span>CampusCare · Student micro-project</span></footer><script src="/staff.js" defer></script></body></html>

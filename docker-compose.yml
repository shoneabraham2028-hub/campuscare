services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-campus-password}
      POSTGRES_DB: campuscare
    volumes: ["campuscare-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campuscare"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    image: campuscare:v1
    ports: ["3000:3000"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: campus
      DB_PASSWORD: ${DB_PASSWORD:-local-campus-password}
      DB_NAME: campuscare
      DB_SSL: "false"
      TOKEN_SECRET: ${TOKEN_SECRET:-local-only-change-this-secret}
      STAFF_USER: ${STAFF_USER:-staff}
      STAFF_PASS: ${STAFF_PASS:-staff123}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
volumes:
  campuscare-db:
